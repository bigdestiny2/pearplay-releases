name: Windows r2 native startup and profile ownership

on:
  workflow_dispatch:

# Download one checksum-pinned candidate through a temporary artifact-only URL.
# This job has no repository write or read capability.
permissions: {}

jobs:
  native-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify draft r2 and run native startup smoke
        env:
          PEARPLAY_PREVIEW_DOWNLOAD_URL: ${{ secrets.PEARPLAY_PREVIEW_DOWNLOAD_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $asset = 'PearPlay-0.2.0-preview.20260905-windows-x64-r2.zip'
          $expectedSha256 = 'a14b6b140956a3cd427850e1e2a62e1b7237479e0deda2d8061842dc5efd8bae'
          $downloadUrl = $env:PEARPLAY_PREVIEW_DOWNLOAD_URL
          $workRoot = Join-Path $env:RUNNER_TEMP ("pearplay-preview-qa-" + [guid]::NewGuid().ToString('N'))
          $profile = Join-Path $workRoot 'profile'
          $expanded = Join-Path $workRoot 'expanded'
          $archive = Join-Path $workRoot $asset
          $process = $null
          $outputTask = $null
          $errorTask = $null
          $failure = $null
          $exitCode = $null
          $stdoutText = ''
          $stderrText = ''
          $hashVerified = $false
          $markerObserved = $false
          $noRemainingRuntime = $false
          $profileLeaseRegressionPassed = $false
          $elapsed = [System.Diagnostics.Stopwatch]::new()
          try {
            New-Item -ItemType Directory -Path $profile, $expanded -Force | Out-Null
            if ([string]::IsNullOrWhiteSpace($downloadUrl) -or $downloadUrl.Length -gt 16384 -or $downloadUrl -match '[\x00-\x20\x7f]') {
              throw 'The temporary preview download URL is missing or malformed.'
            }
            # GitHub masks the repository secret automatically. Mask the exact
            # value and its normalized URI too, and never print download errors
            # that might contain query-string credentials.
            Write-Host "::add-mask::$downloadUrl"
            $downloadUri = $null
            if (-not [Uri]::TryCreate($downloadUrl, [UriKind]::Absolute, [ref]$downloadUri)) {
              throw 'The temporary preview download URL is invalid.'
            }
            if ($downloadUri.Scheme -cne 'https' -or $downloadUri.DnsSafeHost -cne 'release-assets.githubusercontent.com' -or $downloadUri.Port -ne 443 -or $downloadUri.UserInfo -ne '' -or $downloadUri.Fragment -ne '') {
              throw 'The preview URL must use the approved HTTPS release-asset host without user info or fragment.'
            }
            Write-Host "::add-mask::$($downloadUri.AbsoluteUri)"
            try {
              Invoke-WebRequest -Uri $downloadUri -OutFile $archive -MaximumRedirection 0 -TimeoutSec 180
            } catch {
              throw 'Temporary preview download failed. The artifact-only URL may have expired; no package code was executed.'
            }
            # The temporary asset credential never reaches executable code.
            $env:PEARPLAY_PREVIEW_DOWNLOAD_URL = $null
            $downloadUrl = $null
            $downloadUri = $null
            $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -cne $expectedSha256) {
              throw "Archive SHA-256 mismatch. Expected $expectedSha256; received $actualSha256. Nothing was executed."
            }
            $hashVerified = $true
            Expand-Archive -LiteralPath $archive -DestinationPath $expanded
            $packageRoot = Join-Path $expanded 'PearPlay-0.2.0-preview.20260905-windows-x64-r2'
            $executable = Join-Path $packageRoot 'PearPlay/PearPlay.exe'
            $manifest = Get-Content -LiteralPath (Join-Path $packageRoot 'native-package.json') -Raw | ConvertFrom-Json
            if ($manifest.target -cne 'win32-x64' -or $manifest.executable -cne 'PearPlay/PearPlay.exe') {
              throw 'Unexpected native target or entry point in the hash-verified package.'
            }
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw 'The native PearPlay.exe entry point is missing.'
            }

            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $executable
            $start.WorkingDirectory = $profile
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.ArgumentList.Add("--user-data-dir=$(Join-Path $profile 'electron')")
            $start.Environment['PEARPLAY_DESKTOP_SMOKE'] = '1'
            $start.Environment['HOME'] = $profile
            $start.Environment['USERPROFILE'] = $profile
            $start.Environment['APPDATA'] = Join-Path $profile 'AppData/Roaming'
            $start.Environment['LOCALAPPDATA'] = Join-Path $profile 'AppData/Local'
            New-Item -ItemType Directory -Path $start.Environment['APPDATA'], $start.Environment['LOCALAPPDATA'] -Force | Out-Null
            foreach ($name in @('ELECTRON_RUN_AS_NODE', 'NODE_OPTIONS', 'NODE_PATH', 'PEARPLAY_PAIR_TOKEN', 'PEARPLAY_CONTROL_TOKEN', 'PEARPLAY_READY_FD', 'PEARPLAY_LOBBY', 'PEARPLAY_PREVIEW_DOWNLOAD_URL')) {
              $null = $start.Environment.Remove($name)
            }
          $probePath = Join-Path $workRoot 'profile-lease-probe.mjs'
          $probeSource = @'
          import { spawn } from 'node:child_process'
          import { once } from 'node:events'
          import { randomBytes } from 'node:crypto'
          import { join } from 'node:path'
          import { setTimeout as delay } from 'node:timers/promises'
          
          const [payload, profile] = process.argv.slice(2)
          const instances = []
          const isAlive = child => child.exitCode === null && child.signalCode === null
          async function startEngine () {
            const control = randomBytes(32).toString('hex')
            const child = spawn(process.execPath, [join(payload, 'scripts/launch.js')], {
              cwd: profile,
              env: { ...process.env, HOME: profile, USERPROFILE: profile, HOST: '127.0.0.1', PORT: '0',
                ELECTRON_RUN_AS_NODE: '1', PEARPLAY_READY_FD: '', PEARPLAY_CONTROL_TOKEN: control,
                PEARPLAY_PAIR_TOKEN: randomBytes(32).toString('hex'), PEARPLAY_NET: 'swarm' },
              stdio: ['ignore', 'pipe', 'pipe']
            })
            let output = ''
            child.stdout.on('data', data => { output = (output + data).slice(-10000) })
            child.stderr.on('data', data => { output = (output + data).slice(-10000) })
            const closed = once(child, 'close')
            const instance = { child, closed, control, output: () => output }
            instances.push(instance)
            return instance
          }
          async function ready (instance) {
            for (let attempt = 0; attempt < 100; attempt++) {
              const match = instance.output().match(/PEARPLAY cabinet\s+(http:\/\/127\.0\.0\.1:\d+)/)
              if (match) {
                const response = await fetch(match[1] + '/auth/status', {
                  headers: { 'x-pearplay-control': instance.control }, signal: AbortSignal.timeout(2000)
                })
                if (response.status === 200) return match[1]
              }
              if (!isAlive(instance.child)) throw new Error('Engine exited before authentication:\n' + instance.output())
              await delay(100)
            }
            throw new Error('Engine startup deadline exceeded:\n' + instance.output())
          }
          async function stopped (instance, timeoutMs = 5000) {
            let watchdog
            try {
              return await Promise.race([instance.closed, new Promise((resolve, reject) => {
                watchdog = setTimeout(() => reject(new Error('Engine did not exit within its deadline')), timeoutMs)
              })])
            } finally { clearTimeout(watchdog) }
          }
          try {
            const owner = await startEngine()
            const origin = await ready(owner)
            // The packaged launcher writes its ownership heartbeat every five seconds.
            // Survive two updates through the held Windows file descriptor.
            await delay(11000)
            if (!isAlive(owner.child)) throw new Error('Owner died during heartbeat updates:\n' + owner.output())
            const status = await fetch(origin + '/auth/status', {
              headers: { 'x-pearplay-control': owner.control }, signal: AbortSignal.timeout(2000)
            })
            if (status.status !== 200) throw new Error('Owner lost its authenticated listener after heartbeats')
            const contender = await startEngine()
            const [code] = await stopped(contender)
            if (code !== 1 || !contender.output().includes('PearPlay profile is already active')) {
              throw new Error('Same-profile contender was not refused by the kernel ownership guard:\n' + contender.output())
            }
            if (!isAlive(owner.child)) throw new Error('Contender disrupted the existing owner')
            owner.child.kill('SIGKILL')
            await stopped(owner)
            const recovered = await startEngine()
            await ready(recovered)
            recovered.child.kill('SIGKILL')
            await stopped(recovered)
            console.log('PearPlay: Windows profile heartbeat, live-owner rejection, and crash reacquisition passed')
          } catch (error) {
            console.error(error.message)
            process.exitCode = 1
          } finally {
            for (const instance of instances) {
              if (isAlive(instance.child)) instance.child.kill('SIGKILL')
            }
          }
          '@
          Set-Content -LiteralPath $probePath -Value $probeSource -Encoding utf8
          $probeStart = [System.Diagnostics.ProcessStartInfo]::new()
          $probeStart.FileName = $executable
          $probeStart.WorkingDirectory = $profile
          $probeStart.UseShellExecute = $false
          $probeStart.RedirectStandardOutput = $true
          $probeStart.RedirectStandardError = $true
          $probeStart.ArgumentList.Add($probePath)
          $probeStart.ArgumentList.Add((Join-Path $packageRoot 'PearPlay/resources/pearplay'))
          $probeStart.ArgumentList.Add($profile)
          foreach ($entry in $start.Environment.GetEnumerator()) { $probeStart.Environment[$entry.Key] = $entry.Value }
          $probeStart.Environment['ELECTRON_RUN_AS_NODE'] = '1'
          $null = $probeStart.Environment.Remove('PEARPLAY_DESKTOP_SMOKE')
          $probeProcess = [System.Diagnostics.Process]::new()
          $probeProcess.StartInfo = $probeStart
          try {
            if (-not $probeProcess.Start()) { throw 'Windows did not start the profile ownership probe.' }
            $probeOutputTask = $probeProcess.StandardOutput.ReadToEndAsync()
            $probeErrorTask = $probeProcess.StandardError.ReadToEndAsync()
            if (-not $probeProcess.WaitForExit(45000)) {
              $probeProcess.Kill($true)
              $null = $probeProcess.WaitForExit(5000)
              throw 'Windows profile ownership regression probe exceeded its deadline.'
            }
            if (-not $probeOutputTask.Wait(5000) -or -not $probeErrorTask.Wait(5000)) { throw 'Profile regression probe output did not close.' }
            Write-Host $probeOutputTask.Result
            Write-Host $probeErrorTask.Result
            if ($probeProcess.ExitCode -ne 0) { throw 'Windows profile ownership regression probe failed.' }
            if (-not (@($probeOutputTask.Result -split '\r?\n') -ccontains 'PearPlay: Windows profile heartbeat, live-owner rejection, and crash reacquisition passed')) {
              throw 'Profile regression probe did not report its exact success marker.'
            }
            $profileLeaseRegressionPassed = $true
          } finally {
            try { if (-not $probeProcess.HasExited) { $probeProcess.Kill($true) } } catch {}
            $probeProcess.Dispose()
          }
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $start
            $elapsed.Start()
            if (-not $process.Start()) { throw 'Windows did not start PearPlay.exe.' }
            # Drain both redirected streams concurrently so a diagnostic burst
            # cannot deadlock the process while the bounded exit wait runs.
            $outputTask = $process.StandardOutput.ReadToEndAsync()
            $errorTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(45000)) {
              $process.Kill($true)
              $null = $process.WaitForExit(5000)
              throw 'Native startup/shutdown exceeded the 45-second deadline.'
            }
            $exitCode = $process.ExitCode
            if (-not $outputTask.Wait(5000) -or -not $errorTask.Wait(5000)) {
              throw 'Native process exited but an inherited output stream remained open.'
            }
            $stdoutText = $outputTask.Result
            $stderrText = $errorTask.Result
            $markerObserved = @($stdoutText -split '\r?\n') -ccontains 'PearPlay: packaged desktop startup smoke passed'
            if ($exitCode -ne 0) { throw "Native PearPlay.exe exited with code $exitCode." }
            if (-not $markerObserved) { throw 'Exit zero without the exact authenticated-startup success marker is not a pass.' }
            $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $executable })
            if ($remaining.Count -ne 0) {
              foreach ($entry in $remaining) { Stop-Process -Id $entry.ProcessId -Force -ErrorAction SilentlyContinue }
              throw 'A PearPlay native engine/runtime process remained after the shell exited.'
            }
            $noRemainingRuntime = $true
          } catch {
            $failure = $_.Exception.Message
          } finally {
            $env:PEARPLAY_PREVIEW_DOWNLOAD_URL = $null
            $elapsed.Stop()
            if ($null -ne $process) {
              try {
                if (-not $process.HasExited) {
                  $process.Kill($true)
                  $null = $process.WaitForExit(5000)
                }
              } catch {}
            }
            if ($null -ne $outputTask -and $outputTask.IsCompletedSuccessfully) { $stdoutText = $outputTask.Result }
            if ($null -ne $errorTask -and $errorTask.IsCompletedSuccessfully) { $stderrText = $errorTask.Result }
            Write-Host '--- native stdout ---'
            Write-Host $stdoutText
            Write-Host '--- native stderr ---'
            Write-Host $stderrText
            $passed = $null -eq $failure
            $evidence = [ordered]@{
              schemaVersion = 1
              asset = $asset
              expectedSha256 = $expectedSha256
              archiveHashVerified = $hashVerified
              target = 'win32-x64'
              runnerImage = $env:ImageOS
              runnerImageVersion = $env:ImageVersion
              checkedAt = [DateTime]::UtcNow.ToString('o')
              elapsedMilliseconds = $elapsed.ElapsedMilliseconds
              nativeExitCode = $exitCode
              authenticatedEngineMarkerObserved = $markerObserved
              noRemainingNativeRuntime = $noRemainingRuntime
              nativeStartupAndShutdownPassed = $passed
              profileHeartbeatContentionAndRecoveryPassed = $profileLeaseRegressionPassed
              uiTested = $false
              downloadedFileTrustBehaviorTested = $false
              productionQualified = $false
              failure = $failure
            }
            $evidenceJson = $evidence | ConvertTo-Json -Depth 5
            Write-Host $evidenceJson
            $heading = if ($passed) { 'PASS: exact Windows preview native startup' } else { 'FAIL: Windows preview native startup' }
            @(
              "## $heading"
              ''
              'This checks the exact public ZIP on Windows: live ownership heartbeat updates, same-profile contention rejection, crash reacquisition, then the real native shell, child engine private readiness, authenticated /auth/status, exit zero, and engine shutdown. It does not open a BrowserWindow or test UI, games, installer behavior, SmartScreen, signing, or multiplayer.'
              ''
              '```json'
              $evidenceJson
              '```'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            if ($null -ne $process) { $process.Dispose() }
            Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($null -ne $failure) { throw $failure }
